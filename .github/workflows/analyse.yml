name: Analyse technique quotidienne

# GitHub planifie en heure UTC, sans changement d'heure.
# Deux créneaux par marché couvrent l'heure d'été et l'heure d'hiver ;
# l'étape « Vérifier l'horaire » ne garde que ceux qui tombent après la clôture.
# GitHub peut retarder les créneaux de plusieurs heures : une exécution qui part
# dans la nuit (jusqu'à 9h00 Paris) traite la clôture américaine de la veille.
on:
  schedule:
    - cron: "50 15 * * 1-5"   # 17h50 Paris en été  / 16h50 en hiver (ignoré)
    - cron: "50 16 * * 1-5"   # 18h50 Paris en été  / 17h50 en hiver
    - cron: "20 20 * * 1-5"   # 22h20 Paris en été  / 21h20 en hiver (ignoré)
    - cron: "20 21 * * 1-5"   # 23h20 Paris en été  / 22h20 en hiver
    - cron: "30 4 * * 2-6"    # filet de sécurité : 6h30 Paris en été / 5h30 en hiver (séance de la veille)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: analyse
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Vérifier l'horaire (heure de Paris)
        id: horaire
        run: |
          H=$(TZ=Europe/Paris date +%H%M)
          echo "Heure de Paris : $H"
          # Après la clôture US : le soir à partir de 22h05, ou la nuit jusqu'à 9h00
          # (créneau du soir retardé par GitHub, ou filet de sécurité du matin).
          if [ "$H" -ge 2205 ] || [ "$H" -le 0900 ]; then
            APRES_US=true
          else
            APRES_US=false
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || { [ "$H" -ge 1740 ] && [ "$H" -le 2030 ]; } \
             || [ "$APRES_US" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Créneau avant clôture : exécution ignorée."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          # Scan large : seulement après la clôture américaine (ou lancement manuel)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$APRES_US" = "true" ]; then
            echo "us=true" >> "$GITHUB_OUTPUT"
          else
            echo "us=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.horaire.outputs.ok == 'true'

      - uses: actions/setup-python@v6
        if: steps.horaire.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les librairies
        if: steps.horaire.outputs.ok == 'true'
        run: pip install -r requirements.txt

      - name: Lancer l'analyse
        if: steps.horaire.outputs.ok == 'true'
        run: python analyse_technique.py --fichier tickers.txt --sortie data

      - name: Scan large S&P 500 + Nasdaq 100 (après la clôture US)
        if: steps.horaire.outputs.ok == 'true' && steps.horaire.outputs.us == 'true'
        continue-on-error: true      # un échec du scan ne bloque pas l'enregistrement
        run: python scan_large.py --sortie data

      - name: Enregistrer les résultats
        if: steps.horaire.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898293+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Données du $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')"
          git pull --rebase
          git push
